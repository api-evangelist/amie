name: Amie
description: >-
  Amie is an AI-powered calendar, task, and meeting-notes application for
  individuals and teams, positioned as an alternative to meeting recorders like
  Fireflies, Otter, and Fathom. It records calls across platforms without a bot
  participant, generates AI summaries and action items, intelligently schedules
  todos, and consolidates calendar and task management in one app. Amie
  connects to Google Calendar, Gmail, Slack, Notion, Linear, HubSpot,
  Pipedrive, Todoist, ClickUp, Craft, and Apple Reminders, and processes
  meetings in many languages with speaker labeling. In update #128
  (2026-07-14) Amie shipped an official MCP server that lets AI assistants such
  as Claude and ChatGPT read a user's calendar, contacts, tasks, and meeting
  notes and create todos, plus an in-app outbound webhook surface (Early
  Access). Amie is backed by Creandum. It does not publish a general-purpose
  public REST API, OpenAPI spec, SDK, or CLI.
